[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archival-cursive-transcriber"
version = "0.1.0"
description = "Transcribe handwritten cursive archival documents (letters, diaries, ledgers) using the Claude API"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
images = ["Pillow>=10"]
local = [
    "torch>=2.0",
    "transformers>=4.35",
    "Pillow>=10",
    "numpy>=1.24",
    "pypdfium2>=4",
]

[project.scripts]
transcribe = "transcriber.cli:main"

[tool.setuptools]
packages = ["transcriber"]
