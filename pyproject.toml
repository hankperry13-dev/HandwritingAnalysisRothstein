[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archival-cursive-transcriber"
version = "0.1.0"
description = "Transcribe handwritten cursive archival documents (letters, diaries, ledgers) using the Claude API"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
images = ["Pillow>=10"]

[project.scripts]
transcribe = "transcriber.cli:main"

[tool.setuptools]
packages = ["transcriber"]
